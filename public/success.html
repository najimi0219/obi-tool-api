<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お支払い完了 - Obi-Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      padding: 2rem;
    }
    .card {
      max-width: 480px; width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 30px rgba(34,197,94,0.3);
    }
    .icon svg { width: 40px; height: 40px; }
    h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 0.75rem; }
    p { color: #475569; font-size: 0.95rem; line-height: 1.8; margin-bottom: 1.5rem; }
    .steps {
      background: #f8fafc; border-radius: 12px;
      padding: 1.5rem; margin-bottom: 2rem; text-align: left;
    }
    .steps-title { font-size: 0.8rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    .step-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 8px 0; font-size: 0.9rem; color: #334155;
    }
    .step-num {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff; font-size: 0.75rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 32px; border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff; font-size: 1rem; font-weight: 600;
      text-decoration: none; border: none; cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(37,99,235,0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(37,99,235,0.4); }
    .sub-text { margin-top: 1rem; font-size: 0.8rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <h1>お支払いが完了しました</h1>
    <p>Obi-Tool スタンダードプランへのご登録ありがとうございます。アプリでそのままご利用いただけます。</p>
    <div class="steps">
      <div class="steps-title">次のステップ</div>
      <div class="step-item">
        <div class="step-num">1</div>
        <div>Obi-Toolアプリに戻ってください</div>
      </div>
      <div class="step-item">
        <div class="step-num">2</div>
        <div>ライセンスが自動的に有効化されます（数秒〜数分）</div>
      </div>
      <div class="step-item">
        <div class="step-num">3</div>
        <div>反映されない場合は、アプリを再起動してください</div>
      </div>
    </div>
    <a href="/" class="btn">トップページに戻る</a>
    <p class="sub-text">ご不明点は info@najimi-llc.com までお問い合わせください</p>
  </div>
</body>
</html>
